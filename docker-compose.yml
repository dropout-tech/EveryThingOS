services:
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm ci && npm run build && npm run start -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production

# OpenReply (MIT, https://github.com/diwenne/openreply) is the comment-to-DM
# sibling. Do not add a fake image here. Start it only after Meta Page tokens
# and App Review exist. The DropOut operator UX is /workspace/reply; live
# Graph webhooks stay out of this default compose file.
