<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { --bg: #0d1f3b; --navy: #13305a; --teal: #3ca59e; --teal2: #65c5bc; --orange: #e08a3c; --cream: #f4efe4; --dim: rgba(244,239,228,0.62); }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: "Noto Sans CJK TC", sans-serif; color: var(--cream); -webkit-font-smoothing: antialiased; }
  canvas { position: absolute; inset: 0; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  .hide { opacity: 0; }
  b.o { color: var(--orange); font-weight: 700; }
  b.t { color: var(--teal2); font-weight: 700; }

  #hook { left: 0; right: 0; top: 330px; text-align: center; }
  #hook h1 { font-size: 100px; font-weight: 700; letter-spacing: -2px; line-height: 1.15; text-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  #count { font-size: 230px; font-weight: 900; color: var(--orange); line-height: 1; letter-spacing: -6px; }

  .win { position: absolute; width: 330px; border-radius: 18px; background: rgba(19,48,90,0.78); border: 2px solid rgba(101,197,188,0.28); box-shadow: 0 20px 60px rgba(0,0,0,0.45); overflow: hidden; }
  .win .tb { height: 34px; display: flex; align-items: center; gap: 8px; padding-left: 14px; background: rgba(255,255,255,0.06); }
  .win .tb i { width: 11px; height: 11px; border-radius: 50%; background: rgba(244,239,228,0.35); }
  .win .bd { padding: 18px 20px 22px; font-size: 32px; font-weight: 700; }
  .win .bd small { display: block; font-size: 20px; font-weight: 400; color: var(--dim); margin-top: 6px; }

  #pain { left: 0; right: 0; top: 760px; text-align: center; }
  #pain .who { display: inline-block; font-size: 28px; padding: 6px 22px; border-radius: 999px; border: 2px solid var(--orange); color: var(--orange); letter-spacing: 2px; }
  #pain h2 { font-size: 72px; font-weight: 700; margin-top: 18px; letter-spacing: -1px; text-shadow: 0 8px 30px rgba(0,0,0,0.6); }
  #pnum { position: absolute; left: 96px; top: 70px; font-size: 30px; color: var(--dim); letter-spacing: 4px; }

  #reveal { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #reveal p { font-size: 54px; color: var(--dim); }
  #reveal h1 { font-size: 168px; font-weight: 900; letter-spacing: -5px; margin-top: 10px; }
  #reveal h1 span { color: var(--teal2); }

  #ans { inset: 0; }
  #ans .num { position: absolute; left: 110px; top: 250px; font-size: 30px; color: var(--orange); letter-spacing: 3px; }
  #ans .x { position: absolute; left: 110px; top: 300px; width: 640px; font-size: 32px; color: var(--dim); text-decoration: line-through; text-decoration-color: var(--orange); text-decoration-thickness: 3px; line-height: 1.4; }
  #ans h2 { position: absolute; left: 110px; top: 420px; width: 660px; font-size: 64px; font-weight: 700; line-height: 1.25; letter-spacing: -1px; }
  #ans .s { position: absolute; left: 110px; top: 700px; width: 640px; font-size: 28px; color: var(--dim); line-height: 1.45; }
  .shot { position: absolute; left: 820px; width: 1000px; border-radius: 22px; overflow: hidden; background: #fff; box-shadow: 0 30px 90px rgba(0,0,0,0.55), 0 0 0 2px rgba(101,197,188,0.35); }
  .shot .bar { height: 40px; background: #e9e5dc; display: flex; align-items: center; gap: 9px; padding-left: 18px; }
  .shot .bar i { width: 12px; height: 12px; border-radius: 50%; background: #c9c3b6; }
  .shot .bar i:first-child { background: var(--orange); }
  .shot .bar i:nth-child(2) { background: var(--teal); }
  .shot .bar em { font-style: normal; font-size: 20px; color: #5b5448; margin-left: 12px; font-family: monospace; }
  .shot .view { position: relative; overflow: hidden; }
  .shot .view img { position: absolute; left: 0; top: 0; }
  #dots { position: absolute; left: 110px; bottom: 90px; display: flex; gap: 14px; }
  #dots span { width: 46px; height: 8px; border-radius: 4px; background: rgba(244,239,228,0.2); }

  #end { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #end h2 { font-size: 76px; font-weight: 700; letter-spacing: -1px; }
  #end img { width: 1100px; margin-top: 70px; }
  #end .url { margin-top: 48px; font-size: 64px; font-weight: 700; color: var(--teal2); letter-spacing: 2px; }
  #end .url span { color: var(--orange); }
</style>
</head>
<body>
<div id="wins"></div>
<div id="hook" class="abs"><h1 id="hookT">老闆，你今天開了幾個視窗？</h1><div id="count">0</div></div>
<div id="pnum" class="hide"></div>
<div id="pain" class="abs hide"><span class="who" id="who"></span><h2 id="painT"></h2></div>
<div id="reveal" class="abs hide"><p>把這些，收進一個網頁</p><h1>EveryThing<span>OS</span></h1></div>
<div id="ans" class="abs hide">
  <div class="num" id="aNum"></div>
  <div class="x" id="aX"></div>
  <h2 id="aT"></h2>
  <div class="s" id="aS"></div>
  <div class="shot" id="shotA"><div class="bar"><i></i><i></i><i></i><em id="aUrl"></em></div><div class="view"><img id="imgA" /></div></div>
  <div class="shot" id="shotB"><div class="bar"><i></i><i></i><i></i><em id="bUrl"></em></div><div class="view"><img id="imgB" /></div></div>
  <div id="dots"><span></span><span></span><span></span><span></span><span></span><span></span></div>
</div>
<div id="end" class="abs hide">
  <h2>實體門店，只開這一個網頁</h2>
  <img src="/promo/assets/do-lockup-dark.png" alt="" />
  <div class="url">dropout.tw<span>　</span>琢奧科技</div>
</div>
<script type="module" src="./anim.js"></script>
</body>
</html>
