[project]
name = "dropout-onboard"
description = "DropOut OS onboarding toolkit: provision a company site, migrate data, check it"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]

[project.scripts]
dropout-onboard = "dropout_onboard.cli:main"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "dropout_onboard"
