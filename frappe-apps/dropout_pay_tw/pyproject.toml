[project]
name = "dropout_pay_tw"
authors = [{ name = "DropOut Tech", email = "info@dropout.tw" }]
description = "ECPay and NewebPay gateways for Frappe Payments"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
